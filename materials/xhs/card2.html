<!-- 卡2：文史案例 -->
<div id="card2">
  <img class="bg" src="bg2.png">
  <div class="top">
    <div class="tag">📜 名言·文史</div>
    <h1>「以德报怨」<br>孔子根本<span class="y">没这么主张</span></h1>
    <div class="sub">《论语》原文一搜，断章取义当场现形</div>
  </div>
  <div class="bottom">
    <div class="q">或曰：「以德报怨，何如？」子曰：「何以报德？以直报怨，以德报德。」</div>
    <div class="a">🔍 「以德报怨」是<b>别人提的问题</b>；孔子的回答是「以直报怨」。另外「报怨以德」其实出自《老子》</div>
    <div class="src">证据：<span>ctext.org 中国哲学书电子化计划</span> · 汉典 · 维基文库</div>
